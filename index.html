<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitland — náhledy nativních inzerátů (styl Seznam)</title>
<style>
  :root{--bg:#faf9f5;--card:#fff;--surface:#eceae3;--text:#2c2c2a;--muted:#6b6a66;--hint:#9b9a95;--border:#e2e0d8;--seznam:#d52b1e;--red:#d4242a;--name:#1a1a18;--link:#185fa5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:980px;margin:0 auto;padding:32px 20px 56px}
  h1{font-size:24px;font-weight:600;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:22px}
  .cell{display:flex;flex-direction:column;gap:9px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px 17px}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .fav{width:26px;height:26px;border-radius:5px;flex:none;overflow:hidden}
  .fav img{display:block;width:100%;height:100%}
  .name{font-size:16px;font-weight:600;color:var(--name)}
  .rek{margin-left:auto;font-size:13px;color:var(--hint)}
  .bodyrow{display:flex;gap:15px}
  .imgbox{flex:none;width:200px;height:150px;border-radius:9px;overflow:hidden;position:relative;background:var(--surface)}
  .imgbox svg,.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .tit{font-size:17px;font-weight:700;line-height:1.34;color:var(--red);margin:0 0 8px}
  .txt{font-size:14px;color:var(--muted);line-height:1.45;margin:0}
  .foot{display:flex;gap:24px;margin-top:14px;color:var(--hint);font-size:14px}
  .foot span{display:inline-flex;align-items:center;gap:7px}
  .lnk{font:12px ui-monospace,Menlo,monospace;color:var(--link);text-decoration:none;word-break:break-all;padding:0 3px;line-height:1.5}
  .lnk:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">

</div>
